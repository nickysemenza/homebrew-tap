# Bumps a cask to a new version using Homebrew's own tooling. The Release
# workflow in nickysemenza/overboard fires this (`gh workflow run bump.yml`)
# right after it uploads a release zip; it can also be re-run by hand from
# the Actions tab if a bump ever fails.
#
# `brew bump-cask-pr --write-only --commit` downloads the new asset to
# compute its sha256, rewrites `version`/`sha256` (the url stanza keeps its
# `#{version}` interpolation), runs `brew audit --online` and `brew style
# --fix`, and commits "<cask> <version>" on main. git-try-push then pushes
# with retries. A push made with GITHUB_TOKEN doesn't trigger tests.yml, but
# the audit that already ran inside bump-cask-pr is the same check.
name: brew bump cask

on:
  workflow_dispatch:
    inputs:
      cask:
        description: Cask token to bump
        required: true
        default: overboard
      version:
        description: New version (no leading v)
        required: true

permissions: {}

concurrency:
  group: bump-${{ inputs.cask }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1

      - name: Bump cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          CASK: ${{ inputs.cask }}
          VERSION: ${{ inputs.version }}
        run: brew bump-cask-pr --write-only --commit --no-browse --version "$VERSION" "$TAP_NAME/$CASK"

      # No `token` here on purpose: setup-homebrew already installed a global
      # `http.<server>/.extraheader` with the job token, and passing one again
      # makes git send two Authorization headers (GitHub answers 400).
      - name: Push
        uses: Homebrew/actions/git-try-push@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: main
